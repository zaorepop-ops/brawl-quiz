<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brawl Stars Character Quiz</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'quiz/styles.css' %}">
  </head>
  <body>
    {% csrf_token %}
    <main class="app-shell">
      <section class="game-panel" aria-label="Brawl Stars Character Quiz">
        <header class="topbar">
          <div>
            <p class="eyebrow">Brawler Guess · Django</p>
            <h1>Brawl Stars Character Quiz</h1>
          </div>
          <div class="stats-strip" aria-label="Score">
            <div>
              <span id="correctCount">0</span>
              <small>Correct</small>
            </div>
            <div>
              <span id="wrongCount">0</span>
              <small>Wrong</small>
            </div>
            <div>
              <span id="answeredCount">0</span>
              <small>Answered</small>
            </div>
          </div>
        </header>

        <div class="controls" aria-label="Game controls">
          <button class="icon-button" id="restart" type="button" aria-label="Restart" title="Restart">
            <span aria-hidden="true">↻</span>
          </button>
        </div>

        <article class="brawler-stage">
          <div class="timer">
            <div class="timer-bar" id="timerBar"></div>
          </div>
          <div class="avatar-wrap" aria-hidden="true">
            <div class="avatar" id="avatar">
              <img id="brawlerImage" alt="">
              <span id="avatarInitial">?</span>
            </div>
          </div>
          <div class="name-mask" id="maskedName">?????</div>
          <div class="finish-panel" id="finishPanel" hidden>
            <strong>Nice work!</strong>
            <span id="finishResult"></span>
          </div>
        </article>

        <section class="answers" id="answers" aria-label="Answer choices"></section>

        <footer class="status-row">
          <p id="message">Loading…</p>
          <button class="next-button" id="next" type="button" disabled>Next</button>
        </footer>
      </section>
    </main>
    {{ round_seconds|json_script:"quiz-round-seconds" }}
    <script src="{% static 'quiz/quiz.js' %}"></script>
  </body>
</html>
